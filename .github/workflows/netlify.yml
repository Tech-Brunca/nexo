# Publica Nexo en Netlify en cada push a main.
# El repositorio es privado de una organización y el plan gratis de Netlify no lo
# conecta directo, así que GitHub compila y sube el sitio con Netlify CLI.
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  token personal de Netlify
#   NETLIFY_SITE_ID     Project ID del sitio en Netlify
# Las variables de la app (DATABASE_URL, etc.) viven en Netlify, no aquí.
name: Publicar en Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY: 'true'
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install -g netlify-cli
      - name: Compilar y publicar
        run: netlify deploy --build --prod --message "${{ github.sha }}"
