name: nexo
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexo123}
      TZ: America/Costa_Rica
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: nexo
      DB_PASSWORD: ${DB_PASSWORD:-nexo123}
      DB_NAME: nexo
      ADMIN_EMAILS: ${ADMIN_EMAILS:-hferreto@gmail.com}
      SESSION_SECRET: ${SESSION_SECRET:-cambie-esta-clave-secreta}
      TZ: America/Costa_Rica
    ports:
      - "8090:4321"

volumes:
  datos:
